[package]
name = "mermaid-text"
version = "0.56.0"
edition = "2024"
description = "Render Mermaid diagrams as Unicode box-drawing text"
license = "MIT"
repository = "https://github.com/leboiko/markdown-reader/tree/master/crates/mermaid-text"

[lib]
name = "mermaid_text"
path = "src/lib.rs"

[dependencies]
ascii-dag = "0.9.1"
chrono = { version = "0.4", default-features = false, features = [
  "std",
  "clock",
] }
unicode-width = "0.2"
