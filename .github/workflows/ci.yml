name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt clippy
          rustup default stable

      # gpui renders through Vulkan/Wayland/X11 on Linux and needs the
      # corresponding development headers at build time.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libasound2-dev \
            libfontconfig-dev \
            libssl-dev \
            libvulkan-dev \
            libwayland-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-x11-dev \
            pkg-config

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Check formatting
        if: matrix.os == 'macos-latest'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Test
        run: cargo test

  # Windows binaries cannot be cross-built: gpui compiles its HLSL shaders with
  # the DirectX shader compiler, which only runs on Windows.
  windows-package:
    name: Windows portable package
    runs-on: windows-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-package

      - name: Build
        run: cargo build --release

      - name: Stage package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/moeka | Out-Null
          Copy-Item target/release/moeka.exe dist/moeka/
          Copy-Item -Recurse assets dist/moeka/assets
          Copy-Item -Recurse docs dist/moeka/docs
          Copy-Item config.yaml dist/moeka/ -ErrorAction SilentlyContinue

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: moeka-windows-x86_64
          path: dist/moeka
          if-no-files-found: error
