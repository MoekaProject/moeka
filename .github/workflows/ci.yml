name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      pr_profile:
        description: Benchmark the PR job matrix with read-only caches
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  community:
    name: Contributor metadata and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      native: ${{ steps.changes.outputs.native }}
      windows: ${{ steps.matrix.outputs.windows }}
      linux: ${{ steps.matrix.outputs.linux }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select native checks without suppressing required statuses
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: ruby scripts/ci-changes.rb >> "$GITHUB_OUTPUT"
      - name: Select package architectures
        id: matrix
        env:
          FULL: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.pr_profile != true) }}
        run: |
          if [[ "$FULL" == true ]]; then
            echo 'windows=[{"arch":"x86_64","runner":"windows-latest","target":"x86_64-pc-windows-msvc"},{"arch":"arm64","runner":"windows-11-arm","target":"aarch64-pc-windows-msvc"}]' >> "$GITHUB_OUTPUT"
            echo 'linux=[{"arch":"x86_64","runner":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu"},{"arch":"arm64","runner":"ubuntu-22.04-arm","target":"aarch64-unknown-linux-gnu"}]' >> "$GITHUB_OUTPUT"
          else
            echo 'windows=[{"arch":"x86_64","runner":"windows-latest","target":"x86_64-pc-windows-msvc"}]' >> "$GITHUB_OUTPUT"
            echo 'linux=[{"arch":"x86_64","runner":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu"}]' >> "$GITHUB_OUTPUT"
          fi
      - name: Test contributor metadata checks
        run: ruby scripts/test-check-community.rb
      - name: Check issue forms, local documentation links, and workflow policy
        run: ruby scripts/check-community.rb
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.0'
          cache: false
      - name: Validate GitHub Actions syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes=

  release-safety:
    name: Asset paths and offline release safety tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node scripts/check-assets.mjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: bash scripts/test-publish-release.sh
      - run: bash scripts/test-ci-macos-signing.sh
      - run: python3 scripts/test-release-artifacts.py
      - run: bash scripts/test-publish-homebrew.sh

  secrets:
    name: Secret scan (official Gitleaks CLI)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.2'
          cache: false
      - name: Install official CLI (v8.24.3)
        run: go install github.com/zricethezav/gitleaks/v8@v8.24.3
      - name: Scan full reachable history without exposing secrets
        run: gitleaks git --no-banner --redact --log-opts='--all' .

  check:
    name: Build, lint and test (${{ matrix.os }})
    needs: community
    if: needs.community.outputs.native == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            runner: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version

      # gpui renders through Vulkan/Wayland/X11 on Linux and needs the
      # corresponding development headers at build time.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libasound2-dev \
            libfontconfig-dev \
            libssl-dev \
            libvulkan-dev \
            libwayland-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-shm0-dev \
            libxcb-xfixes0-dev \
            libxcb-xkb-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config

      - uses: ./.github/actions/rust-build-cache
        with:
          target: ${{ matrix.target }}
          environment: ${{ matrix.runner }}
          lane: gpui-tests
          read-only: ${{ inputs.pr_profile || false }}

      - name: Check formatting
        if: matrix.os == 'macos-latest'
        run: |
          cargo fmt --all -- --check
          rustfmt --edition 2024 --check .github/actions/rust-build-cache/rustc-cache.rs

      - name: Test compiler-cache routing
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          rustc --edition=2024 --test .github/actions/rust-build-cache/rustc-cache.rs -o "$RUNNER_TEMP/cache-routing-tests"
          "$RUNNER_TEMP/cache-routing-tests"

      - name: Clippy
        run: cargo clippy --release --locked --all-targets

      - name: Full test suite including GPUI events
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/moeka-tests/config
          XDG_CACHE_HOME: ${{ runner.temp }}/moeka-tests/cache
          APPDATA: ${{ runner.temp }}/moeka-tests/config
          LOCALAPPDATA: ${{ runner.temp }}/moeka-tests/cache
        run: cargo test --release --locked --features gpui-test-support

  macos-production:
    name: macOS production build and capability gates
    needs: community
    if: needs.community.outputs.native == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-build-cache
        with:
          target: aarch64-apple-darwin
          environment: macos-15
          read-only: ${{ inputs.pr_profile || false }}
      - name: Build default-feature application
        run: cargo build --release --locked
      - name: Check Mac App Store capability gates
        run: cargo check --release --locked --features mas

  # `make windows` cross-builds the shipped binaries; this job is the native
  # counterpart that would catch vendor/gpui drifting from upstream.
  windows-package:
    name: Windows portable package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    needs: community
    if: needs.community.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.community.outputs.windows) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          rustc --version
          cargo --version

      - uses: ./.github/actions/rust-build-cache
        with:
          target: ${{ matrix.target }}
          environment: ${{ matrix.runner }}
          read-only: ${{ inputs.pr_profile || false }}

      - name: Build
        run: cargo build --release --locked

      - name: Test terminal input
        if: matrix.arch == 'arm64'
        env:
          APPDATA: ${{ runner.temp }}/moeka-terminal-tests/config
          LOCALAPPDATA: ${{ runner.temp }}/moeka-terminal-tests/cache
        run: cargo test --release --locked editor::chat_panel::tests -- --nocapture

      # CI artifacts are candidates, not approved public distributions.
      - name: Stage package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Copy-Item target/${{ matrix.target }}/release/moeka.exe dist/windows/Moeka.exe
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md dist/windows/
          if (Test-Path licenses) { Copy-Item -Recurse licenses dist/windows/ }

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Moeka-windows-${{ matrix.arch }}
          path: dist/windows
          if-no-files-found: error

  linux-package:
    name: Linux portable package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    needs: community
    if: needs.community.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.community.outputs.linux) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          rustc --version
          rustup target add "${{ matrix.target }}"

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libasound2-dev \
            libfontconfig-dev \
            libssl-dev \
            libvulkan-dev \
            libwayland-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-shm0-dev \
            libxcb-xfixes0-dev \
            libxcb-xkb-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            patchelf \
            pkg-config

      - uses: ./.github/actions/rust-build-cache
        with:
          target: ${{ matrix.target }}
          environment: ${{ matrix.runner }}
          read-only: ${{ inputs.pr_profile || false }}

      - name: Build package
        run: CARGO_INCREMENTAL=0 make linux-${{ matrix.arch }}

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Moeka-linux-${{ matrix.arch }}
          path: dist/Moeka-linux-${{ matrix.arch }}.zip
          if-no-files-found: error
          compression-level: 0

  result:
    name: CI result
    if: always()
    needs: [community, release-safety, secrets, check, macos-production, windows-package, linux-package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful selected checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
