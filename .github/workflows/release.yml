name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string
      release_notes:
        description: "Release notes. If empty, the workflow uses the tag message when available."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release_meta:
    name: Release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release notes
        id: meta
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          RELEASE_NOTES_INPUT: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          release_tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="${RELEASE_TAG_INPUT}"
          fi
          if [[ -z "${release_tag}" ]]; then
            echo "release tag is required" >&2
            exit 1
          fi

          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"

          if [[ -n "${RELEASE_NOTES_INPUT}" ]]; then
            printf '%s\n' "${RELEASE_NOTES_INPUT}" > release-notes.md
          else
            git fetch --force --tags
            if git rev-parse -q --verify "refs/tags/${release_tag}" >/dev/null; then
              git for-each-ref "refs/tags/${release_tag}" --format='%(contents)' > release-notes.md
            fi
            if [[ ! -s release-notes.md ]]; then
              printf 'Release %s\n' "${release_tag}" > release-notes.md
            fi
          fi

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    name: Build ${{ matrix.name }}
    runs-on: macos-14
    needs: release_meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            target: aarch64-apple-darwin
            asset_suffix: arm64
            rust_targets: aarch64-apple-darwin
          - name: macOS x86_64
            target: x86_64-apple-darwin
            asset_suffix: x86_64
            rust_targets: x86_64-apple-darwin
          - name: macOS universal
            target: universal-apple-darwin
            asset_suffix: universal
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release_meta.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build app and dmg
        run: |
          set -euo pipefail
          make dmg \
            TARGET=${{ matrix.target }} \
            DMG_PATH=dist/Moeka-macos-${{ matrix.asset_suffix }}.dmg \
            VOLUME_NAME=Moeka-${{ matrix.asset_suffix }}
          ditto -c -k --keepParent target/macos/${{ matrix.target }}/Moeka.app dist/Moeka-macos-${{ matrix.asset_suffix }}.zip

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.asset_suffix }}
          path: |
            dist/Moeka-macos-${{ matrix.asset_suffix }}.dmg
            dist/Moeka-macos-${{ matrix.asset_suffix }}.zip
          if-no-files-found: error

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs:
      - release_meta
      - build
    steps:
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: release

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: dist
          merge-multiple: true

      - name: Validate release token
        env:
          GH_TOKEN: ${{ secrets.MOEKA_PUBLIC_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          repo="MoekaProject/release"
          probe_tag="moeka-release-token-check-${GITHUB_RUN_ID}"
          probe_id=""

          cleanup_probe() {
            if [[ -n "${probe_id}" ]]; then
              gh api --method DELETE "repos/${repo}/releases/${probe_id}" >/dev/null 2>&1 || true
            fi
            gh api --method DELETE "repos/${repo}/git/refs/tags/${probe_tag}" >/dev/null 2>&1 || true
          }
          trap cleanup_probe EXIT

          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error title=Missing MOEKA_PUBLIC_RELEASE_TOKEN::Create a repository secret named MOEKA_PUBLIC_RELEASE_TOKEN with release write access to ${repo}."
            exit 1
          fi

          token_login="$(gh api user --jq '.login')"
          echo "Using release token identity: ${token_login}"

          if ! can_push="$(gh api "repos/${repo}" --jq '.permissions.push // false')"; then
            echo "::error title=Invalid MOEKA_PUBLIC_RELEASE_TOKEN::The token cannot access ${repo}. Make sure the token is authorized for the organization and selected repository."
            exit 1
          fi
          echo "Token push permission on ${repo}: ${can_push}"

          if [[ "${can_push}" != "true" ]]; then
            echo "::error title=Insufficient MOEKA_PUBLIC_RELEASE_TOKEN permissions::The token can access ${repo} but does not have write access."
            exit 1
          fi

          if ! probe_id="$(gh api --method POST "repos/${repo}/releases" \
              -f tag_name="${probe_tag}" \
              -f name="${probe_tag}" \
              -f draft=true \
              -f prerelease=true \
              --jq '.id')"; then
            echo "::error title=Release token cannot create releases::MOEKA_PUBLIC_RELEASE_TOKEN can access ${repo}, but GitHub rejected release writes. Use a token with release write access to ${repo} and authorize SSO if the organization requires it."
            exit 1
          fi

          cleanup_probe
          trap - EXIT

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.MOEKA_PUBLIC_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ needs.release_meta.outputs.tag }}
        run: |
          set -euo pipefail
          repo="MoekaProject/release"
          assets=(
            dist/Moeka-macos-arm64.dmg
            dist/Moeka-macos-arm64.zip
            dist/Moeka-macos-x86_64.dmg
            dist/Moeka-macos-x86_64.zip
            dist/Moeka-macos-universal.dmg
            dist/Moeka-macos-universal.zip
          )

          run_release_command() {
            local output
            if output="$("$@" 2>&1)"; then
              if [[ -n "${output}" ]]; then
                printf '%s\n' "${output}"
              fi
              return 0
            fi

            printf '%s\n' "${output}" >&2
            if grep -q "Resource not accessible by personal access token" <<<"${output}"; then
              echo "::error title=Release token cannot create releases::MOEKA_PUBLIC_RELEASE_TOKEN can be read by this workflow, but GitHub rejected release writes to ${repo}. Use a token with release write access to ${repo} and authorize SSO if the organization requires it."
            fi
            return 1
          }

          if gh release view "${RELEASE_TAG}" --repo "${repo}" >/dev/null 2>&1; then
            run_release_command gh release edit "${RELEASE_TAG}" \
              --repo "${repo}" \
              --title "${RELEASE_TAG}" \
              --notes-file release/release-notes.md \
              --latest
          else
            run_release_command gh release create "${RELEASE_TAG}" \
              --repo "${repo}" \
              --title "${RELEASE_TAG}" \
              --notes-file release/release-notes.md \
              --latest
          fi

          run_release_command gh release upload "${RELEASE_TAG}" \
            --repo "${repo}" \
            --clobber \
            "${assets[@]}"
