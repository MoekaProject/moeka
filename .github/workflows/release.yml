name: Unsigned release candidates (no publishing)

on:
  workflow_dispatch:

# The selected dispatch ref is built, never tagged, signed, or published.
# No release/PAT/notary secrets and no Homebrew writes belong in this workflow.
permissions:
  contents: read

concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remote_servers:
    uses: ./.github/workflows/remote-servers.yml

  build:
    needs: remote_servers
    name: Unsigned macOS ${{ matrix.arch }}
    runs-on: macos-15
    timeout-minutes: 90
    env:
      MOEKA_REMOTE_BUNDLE: ${{ github.workspace }}/remote/servers.mrb
      MOEKA_REQUIRE_REMOTE_BUNDLE: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-build-cache
        with:
          target: ${{ matrix.target }}
          environment: macos-15
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.remote_servers.outputs.artifact }}
          path: remote
      - name: Build unsigned app and DMG
        run: |
          make dmg-one \
            TARGET=${{ matrix.target }} \
            BINARY_PATH=target/${{ matrix.target }}/release/moeka \
            CARGO_TARGET_ARG="--target ${{ matrix.target }}" \
            DMG_PATH=dist/Moeka-macos-${{ matrix.arch }}.dmg \
            VOLUME_NAME=Moeka-${{ matrix.arch }}-candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-candidate-macos-${{ matrix.arch }}-${{ github.sha }}
          path: dist/Moeka-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  build_linux:
    needs: remote_servers
    name: Unsigned Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      MOEKA_REMOTE_BUNDLE: ${{ github.workspace }}/remote/servers.mrb
      MOEKA_REQUIRE_REMOTE_BUNDLE: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          rustc --version
          rustup target add "${{ matrix.target }}"
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake libasound2-dev libfontconfig-dev libssl-dev \
            libvulkan-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-shm0-dev libxcb-xfixes0-dev libxcb-xkb-dev libxcb1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev patchelf pkg-config
      - uses: ./.github/actions/rust-build-cache
        with:
          target: ${{ matrix.target }}
          environment: ${{ matrix.runner }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.remote_servers.outputs.artifact }}
          path: remote
      - name: Build package
        run: CARGO_INCREMENTAL=0 make linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-candidate-linux-${{ matrix.arch }}-${{ github.sha }}
          path: dist/Moeka-linux-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  build_windows:
    needs: remote_servers
    name: Unsigned Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      MOEKA_REMOTE_BUNDLE: ${{ github.workspace }}/remote/servers.mrb
      MOEKA_REQUIRE_REMOTE_BUNDLE: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-build-cache
        with:
          target: ${{ matrix.target }}
          environment: ${{ matrix.runner }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.remote_servers.outputs.artifact }}
          path: remote
      - name: Build package
        shell: pwsh
        run: |
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Copy-Item target/${{ matrix.target }}/release/moeka.exe dist/windows/Moeka.exe
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md dist/windows/
          if (Test-Path licenses) { Copy-Item -Recurse licenses dist/windows/ }
          Compress-Archive -Path dist/windows/* -DestinationPath dist/Moeka-windows-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-candidate-windows-${{ matrix.arch }}-${{ github.sha }}
          path: dist/Moeka-windows-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
