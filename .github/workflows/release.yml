name: Unsigned release candidates (no publishing)

on:
  workflow_dispatch:

# The selected dispatch ref is built, never tagged, signed, or published.
# No release/PAT/notary secrets and no Homebrew writes belong in this workflow.
permissions:
  contents: read

concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Unsigned macOS ${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: candidate-${{ matrix.target }}
      - name: Build unsigned app and DMG
        run: |
          make dmg-one \
            TARGET=${{ matrix.target }} \
            DMG_PATH=dist/Moeka-macos-${{ matrix.arch }}.dmg \
            VOLUME_NAME=Moeka-${{ matrix.arch }}-candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-candidate-macos-${{ matrix.arch }}-${{ github.sha }}
          path: dist/Moeka-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 14

  build_linux:
    name: Unsigned Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake libasound2-dev libfontconfig-dev libssl-dev \
            libvulkan-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-shm0-dev libxcb-xfixes0-dev libxcb-xkb-dev libxcb1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev patchelf pkg-config
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: candidate-linux-${{ matrix.arch }}
      - name: Build package
        run: CARGO_INCREMENTAL=0 make linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-candidate-linux-${{ matrix.arch }}-${{ github.sha }}
          path: dist/Moeka-linux-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14

  build_windows:
    name: Unsigned Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: candidate-windows-${{ matrix.arch }}
      - name: Build package
        shell: pwsh
        run: |
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Copy-Item target/release/moeka.exe dist/windows/Moeka.exe
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md dist/windows/
          if (Test-Path licenses) { Copy-Item -Recurse licenses dist/windows/ }
          Compress-Archive -Path dist/windows/* -DestinationPath dist/Moeka-windows-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-candidate-windows-${{ matrix.arch }}-${{ github.sha }}
          path: dist/Moeka-windows-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14
