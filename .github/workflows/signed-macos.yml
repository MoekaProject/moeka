name: Signed macOS candidates (no publishing)

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      remote_bundle_artifact:
        type: string
        default: ''
    secrets:
      MACOS_CERTIFICATE_BASE64:
        required: true
      MACOS_CERTIFICATE_PASSWORD:
        required: true
      APPLE_ID:
        required: true
      APPLE_APP_SPECIFIC_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: 'Committed version to verify, e.g. 0.1.38 (without v)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: signed-macos-candidates
  cancel-in-progress: false

jobs:
  remote_servers:
    if: inputs.remote_bundle_artifact == '' && github.repository == 'MoekaProject/moeka' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/remote-servers.yml
    with:
      sign_macos: true
    secrets:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

  build:
    needs: remote_servers
    if: always() && !cancelled() && !failure() && github.repository == 'MoekaProject/moeka' && github.ref == 'refs/heads/main'
    name: Build unsigned app ${{ matrix.arch }}
    runs-on: macos-15
    timeout-minutes: 90
    env:
      MOEKA_REMOTE_BUNDLE: ${{ github.workspace }}/remote/servers.mrb
      MOEKA_REQUIRE_REMOTE_BUNDLE: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify version and source
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 scripts/release-artifacts.py version --version "$EXPECTED_VERSION"
      - uses: ./.github/actions/rust-build-cache
        with:
          target: ${{ matrix.target }}
          environment: macos-15
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.remote_bundle_artifact || needs.remote_servers.outputs.artifact }}
          path: remote
      - name: Build without signing credentials
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          make app TARGET="$TARGET" BINARY_PATH="target/$TARGET/release/moeka" CARGO_TARGET_ARG="--target $TARGET"
          mkdir -p candidate
          ditto -c -k --sequesterRsrc --keepParent "target/macos/$TARGET/Moeka.app" candidate/unsigned-app.zip
          shasum -a 256 candidate/unsigned-app.zip > candidate/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-signing-input-${{ matrix.arch }}-${{ github.sha }}
          path: candidate/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  sign:
    needs: build
    if: github.repository == 'MoekaProject/moeka' && github.ref == 'refs/heads/main'
    name: Sign and notarize ${{ matrix.arch }}
    runs-on: macos-15
    environment: release-signing
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Refuse blind notarization retries
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [[ "$RUN_ATTEMPT" != 1 ]]; then
            echo "Do not resubmit on rerun. Inspect the original recovery artifact and submission ID first." >&2
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-signing-input-${{ matrix.arch }}-${{ github.sha }}
          path: candidate
      - name: Verify and extract the same-run unsigned app
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          shasum -a 256 -c candidate/SHA256SUMS
          mkdir -p "$RUNNER_TEMP/moeka-app"
          ditto -x -k candidate/unsigned-app.zip "$RUNNER_TEMP/moeka-app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_TEMP/moeka-app/Moeka.app/Contents/Info.plist")" = "$EXPECTED_VERSION"
          lipo "$RUNNER_TEMP/moeka-app/Moeka.app/Contents/MacOS/moeka" -verify_arch "$ARCH"
      - name: Install temporary signing and notarization credentials
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          DEVELOPER_ID_APPLICATION: ${{ vars.DEVELOPER_ID_APPLICATION }}
        run: bash scripts/ci-macos-signing.sh setup
      - name: Sign, notarize, staple and package
        env:
          ARCH: ${{ matrix.arch }}
          DEVELOPER_ID_APPLICATION: ${{ vars.DEVELOPER_ID_APPLICATION }}
          SIGNING_KEYCHAIN: ${{ runner.temp }}/moeka-signing/signing.keychain-db
          NOTARY_KEYCHAIN: ${{ runner.temp }}/moeka-signing/signing.keychain-db
          NOTARY_OUTPUT_DIR: ${{ runner.temp }}/moeka-notary-results
        run: |
          bash scripts/sign_notarize_package.sh \
            "$RUNNER_TEMP/moeka-app/Moeka.app" \
            "$RUNNER_TEMP/moeka-dmg-root" \
            "dist/Moeka-macos-$ARCH.dmg" \
            "dist/Moeka-macos-$ARCH.zip" \
            "Moeka-$ARCH" Moeka install-bg.jpg \
            "$DEVELOPER_ID_APPLICATION" moeka-ci
      - name: Record candidate provenance and hashes
        env:
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          printf 'version=%s\nsource_sha=%s\nrun_id=%s\narch=%s\n' \
            "$VERSION" "$SOURCE_SHA" "$GITHUB_RUN_ID" "$ARCH" > dist/build-info.txt
          (cd dist && shasum -a 256 "Moeka-macos-$ARCH.dmg" "Moeka-macos-$ARCH.zip" > SHA256SUMS)
          python3 scripts/release-artifacts.py record --version "$VERSION" --platform macos --arch "$ARCH"
      - name: Remove signing credentials
        if: always()
        run: bash scripts/ci-macos-signing.sh cleanup
      - name: Retain notarization recovery material (no credentials)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notarization-recovery-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/moeka-notary-results/
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
      - name: Upload verified signed candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-candidate-macos-${{ matrix.arch }}-${{ inputs.version }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
