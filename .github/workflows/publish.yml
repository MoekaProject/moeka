name: Publish official release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Committed version, without v (e.g. 0.1.38)'
        required: true
        type: string
      prerelease:
        description: Publish as a prerelease without updating Homebrew
        type: boolean
        default: false
      candidate_only:
        description: Run the full build/signing pipeline and verify artifacts without publishing or updating tags/Cask
        type: boolean
        default: false
      source_tag:
        description: Existing immutable source tag to publish instead of the current main commit
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: official-release
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'MoekaProject/moeka' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    environment: release-signing
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the immutable source tag
        id: source
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          source_sha="$GITHUB_SHA"
          if [[ -n "$SOURCE_TAG" ]]; then
            test "$SOURCE_TAG" = "v$VERSION"
            source_sha=$(git rev-parse --verify "refs/tags/$SOURCE_TAG^{commit}")
            remote_sha=$(git ls-remote origin "refs/tags/$SOURCE_TAG^{}" | cut -f1)
            test "$remote_sha" = "$source_sha"
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate committed version and remote release state
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ONLY: ${{ inputs.candidate_only }}
          MOEKA_RELEASE_SOURCE_SHA: ${{ steps.source.outputs.sha }}
          MOEKA_RELEASE_SOURCE_TAG: ${{ inputs.source_tag }}
          MOEKA_RELEASE_CHECKOUT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 scripts/release-artifacts.py version --version "$VERSION"
          : "${GH_TOKEN:?Missing GITHUB_TOKEN}"
          gh auth setup-git
          test -f "packaging/release-notes/v$VERSION.md"
          if [[ "$CANDIDATE_ONLY" != true ]]; then
            mkdir -p "$RUNNER_TEMP/release-tools"
            git show "$GITHUB_SHA:scripts/publish-release.sh" > "$RUNNER_TEMP/release-tools/publish-release.sh"
            bash "$RUNNER_TEMP/release-tools/publish-release.sh" check "v$VERSION"
          fi
      - name: Validate Apple credentials before building any release artifacts
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          DEVELOPER_ID_APPLICATION: ${{ vars.DEVELOPER_ID_APPLICATION }}
        run: bash scripts/ci-macos-signing.sh setup
      - name: Remove validation credentials
        if: always()
        run: bash scripts/ci-macos-signing.sh cleanup

  remote_servers:
    needs: preflight
    uses: ./.github/workflows/remote-servers.yml
    with:
      sign_macos: true
      source_sha: ${{ needs.preflight.outputs.source_sha }}
    secrets:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

  macos:
    needs: [preflight, remote_servers]
    uses: ./.github/workflows/signed-macos.yml
    with:
      version: ${{ inputs.version }}
      remote_bundle_artifact: ${{ needs.remote_servers.outputs.artifact }}
      source_sha: ${{ needs.preflight.outputs.source_sha }}
    secrets:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

  portable:
    needs: [preflight, remote_servers]
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      MOEKA_REMOTE_BUNDLE: ${{ github.workspace }}/remote/servers.mrb
      MOEKA_REQUIRE_REMOTE_BUNDLE: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: linux
            arch: arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: windows
            arch: x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: windows
            arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libasound2-dev libfontconfig-dev libssl-dev \
            libvulkan-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-shm0-dev libxcb-xfixes0-dev libxcb-xkb-dev libxcb1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev patchelf pkg-config
      - uses: ./.github/actions/rust-build-cache
        with:
          target: ${{ matrix.target }}
          environment: ${{ matrix.runner }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.remote_servers.outputs.artifact }}
          path: remote
      - name: Build Linux package
        if: matrix.platform == 'linux'
        env:
          ARCH: ${{ matrix.arch }}
        run: CARGO_INCREMENTAL=0 make "linux-$ARCH"
      - name: Build Windows package (no Authenticode certificate configured)
        if: matrix.platform == 'windows'
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        shell: pwsh
        run: |
          cargo build --release --locked --target $env:TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Copy-Item "target/$env:TARGET/release/moeka.exe" dist/windows/Moeka.exe
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md dist/windows/
          Copy-Item -Recurse licenses dist/windows/
          Compress-Archive -Path dist/windows/* -DestinationPath "dist/Moeka-windows-$env:ARCH.zip"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Record artifact provenance
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          MOEKA_RELEASE_SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          git show "$GITHUB_SHA:scripts/release-artifacts.py" > "$RUNNER_TEMP/release-artifacts.py"
          python "$RUNNER_TEMP/release-artifacts.py" record --version "$VERSION" --platform "$PLATFORM" --arch "$ARCH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-package-${{ matrix.platform }}-${{ matrix.arch }}-${{ needs.preflight.outputs.source_sha }}
          path: |
            dist/Moeka-${{ matrix.platform }}-${{ matrix.arch }}.zip
            dist/manifest.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  verify-candidate:
    needs: [preflight, macos, portable]
    if: inputs.candidate_only && github.repository == 'MoekaProject/moeka' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: signed-candidate-macos-*-${{ needs.preflight.outputs.source_sha }}
          path: incoming/macos
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-package-*-${{ needs.preflight.outputs.source_sha }}
          path: incoming/portable
      - name: Verify all candidate artifacts without publication
        env:
          VERSION: ${{ inputs.version }}
          MOEKA_RELEASE_SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          git show "$GITHUB_SHA:scripts/release-artifacts.py" > "$RUNNER_TEMP/release-artifacts.py"
          python3 "$RUNNER_TEMP/release-artifacts.py" collect --version "$VERSION" --source incoming
          python3 "$RUNNER_TEMP/release-artifacts.py" verify --version "$VERSION"

  publish:
    needs: [preflight, macos, portable]
    if: inputs.candidate_only != true && github.repository == 'MoekaProject/moeka' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # This job creates the source tag and Release; it never changes main.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: signed-candidate-macos-*-${{ needs.preflight.outputs.source_sha }}
          path: incoming/macos
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-package-*-${{ needs.preflight.outputs.source_sha }}
          path: incoming/portable
      - name: Verify all six platform groups and eight attachments
        env:
          VERSION: ${{ inputs.version }}
          MOEKA_RELEASE_SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          set -euo pipefail
          git show "$GITHUB_SHA:scripts/release-artifacts.py" > "$RUNNER_TEMP/release-artifacts.py"
          python3 "$RUNNER_TEMP/release-artifacts.py" collect --version "$VERSION" --source incoming
          rm -r incoming
      - name: Publish verified artifacts without building or signing
        env:
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
          MOEKA_RELEASE_SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          MOEKA_RELEASE_SOURCE_TAG: ${{ inputs.source_tag }}
          MOEKA_RELEASE_CHECKOUT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          mkdir -p "$RUNNER_TEMP/release-tools"
          git show "$GITHUB_SHA:scripts/publish-release.sh" > "$RUNNER_TEMP/release-tools/publish-release.sh"
          export MOEKA_RELEASE_ARTIFACTS_SCRIPT="$RUNNER_TEMP/release-artifacts.py"
          mode=publish
          if [[ "$PRERELEASE" == true ]]; then mode=publish-beta; fi
          bash "$RUNNER_TEMP/release-tools/publish-release.sh" "$mode" "v$VERSION"
          printf 'Release: https://github.com/MoekaProject/moeka/releases/tag/v%s\n' "$VERSION" >> "$GITHUB_STEP_SUMMARY"

  homebrew:
    needs: publish
    if: inputs.candidate_only != true && inputs.prerelease == false && github.repository == 'MoekaProject/moeka' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Update Tap only after stable release publication
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          bash scripts/publish-homebrew.sh "v$VERSION"
