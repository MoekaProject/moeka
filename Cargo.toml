[workspace]

[package]
name = "moeka"
version = "0.1.5"
edition = "2024"

[[bin]]
name = "moeka"
path = "src/main.rs"

[dependencies]
anyhow = "1"
alacritty_terminal = { git = "https://github.com/alacritty/alacritty", rev = "9d9640d" }
gpui = "0.2.2"
printpdf = "0.7"
pulldown-cmark = { version = "0.13.0", default-features = false, features = [
  "html",
] }
similar = { version = "2", features = ["inline", "unicode"] }
unicode-segmentation = "1.10"
image = "0.25"
syntect = { version = "5.2", default-features = false, features = [
  "default-fancy",
] }
notify = "8"
opener = { version = "0.8", features = ["reveal"] }
rfd = "0.15"
ureq = "2.12"
regex = "1"
percent-encoding = "2"
directories = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sys-locale = "0.3"
sysinfo = "0.31.4"
pinyin = "0.10"
trash = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
emojis = "0.6"
portable-pty = "0.9.0"
mathjax-svg-rs = "0.4"
merman = { version = "0.8.0-alpha.3", features = ["render"] }
resvg = { version = "0.45", default-features = false, features = [
  "text",
  "system-fonts",
  "memmap-fonts",
] }
usvg = { version = "0.45.1", default-features = false, features = [
  "text",
  "system-fonts",
  "memmap-fonts",
] }
tantivy = "0.26.1"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
pprof = { version = "0.15", features = ["flamegraph"] }

[dev-dependencies]
tempfile = "3"

# Build dependencies resolve against the host, so this cannot be gated on a
# Windows `cfg` or cross-compiling would lose it.
[build-dependencies]
embed-resource = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
block = "0.1"
core-graphics = "0.24"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Ole",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# Optimize all dependencies in dev mode for better performance
# while keeping the app itself at opt-level 1 for faster compile times
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Release builds are used for both daily runs and macOS packages. Dependencies
# remain fully optimized; only the application crate favors compile speed.
[profile.release]
lto = false
codegen-units = 16
incremental = true
strip = true

[profile.release.package.moeka]
opt-level = 1
codegen-units = 256

[profile.profiling]
inherits = "release"
debug = true
strip = false
lto = false
codegen-units = 16

[profile.profiling.package.moeka]
opt-level = 3
codegen-units = 16
