[workspace]

[package]
name = "markdown-editor"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "markdown-editor"
path = "src/main.rs"

[dependencies]
anyhow = "1"
gpui = "0.2.2"
pulldown-cmark = { version = "0.13.0", default-features = false }
unicode-segmentation = "1.10"
image = "0.25"
smallvec = "1.6"
syntect = { version = "5.2", default-features = false, features = [
  "default-fancy",
] }
notify = "8"
rfd = "0.15"
ureq = "2.12"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
raw-window-handle = "0.6"

# Optimize all dependencies in dev mode for better performance
# while keeping the app itself at opt-level 1 for faster compile times
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
